services:
  tagbox:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: tagbox
    restart: unless-stopped

    networks:
      - kebabstugan_default

    cpus: 0.50
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kebabstugan_default:
    external: true